name: Publish Oto Kiralama Independent Mirror

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-rent30-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dedicated public repository
        uses: actions/checkout@v4

      - name: Capture the complete self-contained prototype
        shell: bash
        run: |
          set -euo pipefail
          base='https://oto-kiralama-akis-test.tolga-buyukyuksel.workers.dev'
          target='oto-kiralama-prototip'
          rm -rf "$target"
          mkdir -p "$target/vendor" "$target/assets"

          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/" -o "$target/index.html"
          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/vendor/three.module.js" -o "$target/vendor/three.module.js"
          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/vendor/OrbitControls.js" -o "$target/vendor/OrbitControls.js"
          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/vendor/RoundedBoxGeometry.js" -o "$target/vendor/RoundedBoxGeometry.js"
          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/assets/egea-sedan-ref.webp" -o "$target/assets/egea-sedan-ref.webp"
          curl -fL --retry 20 --retry-all-errors --retry-delay 2 "$base/assets/egea-cross-ref.webp" -o "$target/assets/egea-cross-ref.webp"

          sed -i "s|from '/vendor/|from './vendor/|g" "$target/index.html"
          sed -i "s|='/assets/|='./assets/|g" "$target/index.html"

          grep -q '<title>NEXT RENT | Kiralamanın Yeni Yolu</title>' "$target/index.html"
          grep -q 'YOLUN SİZİN' "$target/index.html"
          grep -q 'BAGAJ SİMÜLATÖRÜ' "$target/index.html"
          grep -q "from './vendor/three.module.js'" "$target/index.html"
          grep -q "'./assets/egea-sedan-ref.webp'" "$target/index.html"
          grep -q "REVISION = '166'" "$target/vendor/three.module.js"
          test -s "$target/assets/egea-sedan-ref.webp"
          test -s "$target/assets/egea-cross-ref.webp"

          if grep -Rqi 'peopleofvela\.com' "$target"; then
            echo 'Forbidden People of Vela reference found.'
            exit 1
          fi

          printf '%s\n' '{"ok":true,"project":"oto-kiralama-prototip","host":"independent-public-mirror","simulator":"threejs-live"}' > "$target/health.json"
          touch "$target/.nojekyll"

      - name: Commit the independent static copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oto-kiralama-prototip
          if ! git diff --cached --quiet; then
            git commit -m 'Publish self-contained 3D oto kiralama prototype'
            git push origin HEAD:main
          fi
          echo "PUBLIC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify immutable public CDN files
        shell: bash
        run: |
          set -euo pipefail
          base="https://rawcdn.githack.com/tolgabuyukyuksel-tech/deneme/${PUBLIC_COMMIT}/oto-kiralama-prototip"
          ready=0
          for attempt in $(seq 1 50); do
            curl -sSL "$base/index.html" -o /tmp/rent30.html || true
            curl -sSL "$base/health.json" -o /tmp/rent30-health.json || true
            if grep -q 'BAGAJ SİMÜLATÖRÜ' /tmp/rent30.html 2>/dev/null \
              && grep -q '"simulator":"threejs-live"' /tmp/rent30-health.json 2>/dev/null; then
              ready=1
              break
            fi
            echo "CDN attempt $attempt/50 not ready"
            sleep 4
          done
          test "$ready" = 1
          for asset in \
            /vendor/three.module.js \
            /vendor/OrbitControls.js \
            /vendor/RoundedBoxGeometry.js \
            /assets/egea-sedan-ref.webp \
            /assets/egea-cross-ref.webp; do
            meta="$(curl -sSL -o /tmp/cdn-asset -w '%{http_code} %{content_type}' "$base$asset")"
            echo "$meta" | grep -q '^200 '
            test -s /tmp/cdn-asset
            echo "Verified $asset: $meta"
          done
          echo "PUBLIC_URL=$base/index.html" | tee -a "$GITHUB_ENV"

      - name: Run browser acceptance tests on independent mirror
        run: |
          set -euo pipefail
          export SITE_URL="https://rawcdn.githack.com/tolgabuyukyuksel-tech/deneme/${PUBLIC_COMMIT}/oto-kiralama-prototip/index.html"
          npm install --no-save --ignore-scripts playwright-core@1.54.2
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader']
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, bypassCSP: true });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));

          await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForSelector('#threeMount canvas', { state: 'attached', timeout: 30000 });
          await page.waitForTimeout(900);
          assert.equal((await page.locator('#placedCount').textContent()).trim(), '0/0');
          assert.match((await page.locator('#stageTitle').textContent()).trim(), /Bagaj boş/);

          await page.locator('[data-plus="cabin"]').click();
          await page.waitForFunction(() => document.querySelector('#placedCount')?.textContent.trim() === '1/1');
          await page.locator('[data-plus="cabin"]').click();
          await page.waitForFunction(() => document.querySelector('#placedCount')?.textContent.trim() === '2/2');
          await page.waitForFunction(() => document.querySelector('#engineState')?.textContent.includes('hazır'), null, { timeout: 15000 });

          await page.locator('#closeBtn').click();
          await page.waitForFunction(() => document.querySelector('#sceneStatus strong')?.textContent.includes('BAGAJ SORUNSUZ KAPANIYOR'), null, { timeout: 10000 });
          await page.locator('#openBtn').click();
          await page.locator('[data-vehicle="cross"]').click();
          await page.waitForFunction(() => document.querySelector('#stageVehicle')?.textContent.includes('Cross'));
          await page.waitForFunction(() => document.querySelector('#placedCount')?.textContent.trim() === '2/2');

          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(350);
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
          assert.ok(overflow <= 1, `overflow=${overflow}`);
          assert.equal(errors.length, 0, errors.join('\n'));
          console.log(`PASS: independent mirror ${process.env.SITE_URL}`);
          await browser.close();
          NODE
